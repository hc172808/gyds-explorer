kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.env]
PORT = "8080"

[services.development]
run = "npm run dev --workspace=@workspace/api-server"

[services.production]

[services.production.build]
args = ["npm", "run", "build", "--workspace=@workspace/api-server"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we run the compiled output directly to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"

[[services]]
name = "Lite Node RPC"
localPort = 8545
paths = ["/node-lite"]

[services.env]
PORT = "8545"
NODE_ROLE = "lite"
RPC_MODE = "auto"
RPC_MOCK_FALLBACK = "true"

[services.development]
run = "npm run node:lite --workspace=@workspace/scripts"

[services.production.run]
args = ["node", "scripts/src/local-node.mjs", "--role", "lite"]

[[services]]
name = "RPC Node"
localPort = 8555
paths = ["/node-rpc"]

[services.env]
PORT = "8555"
NODE_ROLE = "rpc"
RPC_MODE = "auto"
RPC_MOCK_FALLBACK = "true"

[services.development]
run = "npm run node:rpc --workspace=@workspace/scripts"

[services.production.run]
args = ["node", "scripts/src/local-node.mjs", "--role", "rpc"]