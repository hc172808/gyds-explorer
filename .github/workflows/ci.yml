name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Token decimals check
        run: bun run check:decimals

      - name: Unit tests
        run: bun run test

      - name: Build frontend
        run: bun run build

      - name: dist-check
        run: bash scripts/dist-check.sh
